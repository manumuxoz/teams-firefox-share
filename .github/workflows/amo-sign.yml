name: AMO Sign

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal de AMO"
        type: choice
        options:
          - unlisted
          - listed
        default: unlisted

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: |
          npm test
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Verify version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(jq -r .version extension/manifest.json)"
          test "$package_version" = "$manifest_version"

      - name: Build
        run: npm run build

      - name: Check AMO secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER" || { echo "Falta AMO_JWT_ISSUER" >&2; exit 1; }
          test -n "$AMO_JWT_SECRET" || { echo "Falta AMO_JWT_SECRET" >&2; exit 1; }

      - name: Sign with AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir extension \
            --artifacts-dir dist/signed \
            --channel "${{ inputs.channel }}" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Upload signed XPI
        uses: actions/upload-artifact@v7
        with:
          name: signed-xpi
          path: dist/signed/*.xpi
          if-no-files-found: error
