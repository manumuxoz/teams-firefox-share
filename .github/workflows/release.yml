name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Firefox ESR
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0
          sudo apt-get install -y libdbus-glib-1-2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Verify manifest version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(jq -r .version extension/manifest.json)"
          test "$package_version" = "$manifest_version"

      - name: Fixed pipeline
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: make ci

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.xpi
            dist/*-sources.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.xpi
            dist/*-sources.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            **Aviso:** el `.xpi` adjunto no está firmado. Firefox release solo lo instalará en modo desarrollador (`about:debugging`) o mediante una firma de AMO. Para instalación permanente, usa la versión firmada de AMO.
          generate_release_notes: true
