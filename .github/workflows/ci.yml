name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web-ext
        run: npm install

      - name: Unit tests (constraints)
        run: npm test

      - name: Lint extension
        run: npm run lint:extension

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Doctor tests
        run: python -m unittest discover -s tests -p "test_*.py"
